# Yerel gelistirme: sadece veritabani (ve istege bagli Adminer) container'da calisir.
# Backend ve frontend'i host'ta `npm run start:dev` / `npm run dev` ile calistirin.
#
#   docker compose -f docker-compose.dev.yml up -d
#
name: futbolvitrini-dev

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-futbolvitrini}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-futbolvitrini}
      POSTGRES_DB: ${POSTGRES_DB:-futbolvitrini}
      TZ: ${TZ:-Europe/Istanbul}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - db_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-futbolvitrini}']
      interval: 10s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - '${ADMINER_PORT:-8081}:8080'

volumes:
  db_dev_data:
