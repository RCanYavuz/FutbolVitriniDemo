# Futbol Vitrini - uretim/staging yigini
#
# Portainer > Stacks > Add stack > Repository ile bu dosya dogrudan kullanilabilir.
# Gerekli ortam degiskenleri Portainer'in "Environment variables" bolumunde
# ya da .env dosyasinda tanimlanir (bkz. .env.example).

# Proje adi sabit: dev yigini ayri bir isim kullandigi icin ikisi birbirini ezmez.
name: futbolvitrini

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-futbolvitrini}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD tanimlanmali}
      POSTGRES_DB: ${POSTGRES_DB:-futbolvitrini}
      TZ: ${TZ:-Europe/Istanbul}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-futbolvitrini} -d ${POSTGRES_DB:-futbolvitrini}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - fv_internal

  backend:
    build:
      context: ./fv_backend
      dockerfile: Dockerfile
    image: ${REGISTRY_PREFIX:-futbolvitrini}/fv-backend:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-futbolvitrini}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-futbolvitrini}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET tanimlanmali}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET tanimlanmali}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      # Yerel HTTP icin false; HTTPS arkasindaki gercek deploy'da mutlaka true.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Frontend nginx /docs yolunu proxy'ledigi icin bu yiginda sabittir.
      SWAGGER_PATH: docs
      # Container acilirken prisma migrate deploy calistirir
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      # Idempotent demo seed'i; gercek uretimde ilk kurulumdan sonra false yapin.
      RUN_SEED: ${RUN_SEED:-false}
      TZ: ${TZ:-Europe/Istanbul}
    networks:
      - fv_internal
    # Backend disariya acilmaz; tum trafik frontend'deki nginx uzerinden gecer.
    # Dogrudan erisim isterseniz asagiyi acin:
    # ports:
    #   - '${BACKEND_PORT:-3000}:3000'

  frontend:
    build:
      context: ./fv_frontend
      dockerfile: Dockerfile
      args:
        # Bos birakilirsa uygulama ayni origin uzerinden /api/v1 kullanir.
        VITE_API_URL: ${VITE_API_URL:-}
    image: ${REGISTRY_PREFIX:-futbolvitrini}/fv-frontend:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: 3000
      TZ: ${TZ:-Europe/Istanbul}
    ports:
      - '${FRONTEND_PORT:-8080}:8080'
    networks:
      - fv_internal

volumes:
  db_data:

networks:
  fv_internal:
    driver: bridge
